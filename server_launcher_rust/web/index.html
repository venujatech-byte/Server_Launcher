<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Server Launcher</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="app-window">
      <!-- 0. Dedicated Slim Custom Titlebar (Height 22px, matching egui) -->
      <div class="window-titlebar" id="window-titlebar" data-tauri-drag-region>
        <div class="titlebar-brand" data-tauri-drag-region>
          <span class="brand-dot">●</span>
          <span class="brand-title">SERVER LAUNCHER</span>
        </div>
        <div class="titlebar-controls" id="titlebar-controls">
          <button class="win-btn win-minimize" id="btn-minimize" title="Minimize" aria-label="Minimize">&#x2212;</button>
          <button class="win-btn win-maximize" id="btn-maximize" title="Maximize" aria-label="Maximize">&#x25a2;</button>
          <button class="win-btn win-close" id="btn-close" title="Close" aria-label="Close">&#x2715;</button>
        </div>
      </div>
      <!-- 1. Full-width App Header Toolbar -->
      <header class="app-header">
        <div class="header-left">
          <div class="brand-logo-card" title="Server Launcher">
            <span class="icon logo-icon">&#xe153;</span>
          </div>
          <div class="header-titles">
            <h1 class="header-app-name">Server Launcher</h1>
            <div class="header-meta">
              <span class="meta-label">this pc:</span>
              <span class="meta-ip" id="meta-ip">192.168.1.5</span>
              <span class="meta-label">servers:</span>
              <span class="meta-count" id="meta-count">3</span>
            </div>
          </div>
        </div>
        <div class="header-right">
          <div class="search-pill-box">
            <kbd class="kbd-hint">Ctrl+K</kbd>
            <input type="text" class="search-input" id="global-search" placeholder="Search instances, ports..." />
            <span class="icon search-icon">&#xe151;</span>
          </div>
          <button class="btn-pill btn-quick-launch" id="btn-quick-launch">
            <span class="icon icon-lightning">&#xe1b4;</span>
            <span>Quick Launch Ctrl+P</span>
          </button>
          <button class="btn-pill btn-add-server" id="btn-add-server">
            <span class="icon">&#xe13d;</span>
            <span>+ Add Server</span>
          </button>
          <button class="btn-icon btn-header-settings" id="btn-settings" title="Settings">
            <span class="icon">&#xe155;</span>
          </button>
        </div>
      </header>
      <!-- 2. Main Workspace Body: Device Rail + Dual Panels (Left & Right) -->
      <div class="workspace-body">
        <!-- Far-left Device Rail (src/app.rs machines_nav_bar) -->
        <aside class="device-rail" id="device-rail">
          <button class="rail-item active" id="rail-local" title="Local Machine (This PC)">
            <span class="icon">&#xe11d;</span>
          </button>
          <button class="rail-item" id="rail-remote" title="Remote Server (tab)">
            <span class="icon">&#xe0e8;</span>
          </button>
          <button class="rail-item has-beacon" id="rail-adb-1" title="SM T295 (Android)">
            <span class="icon">&#xe163;</span>
            <span class="beacon-dot"></span>
          </button>
          <button class="rail-item has-beacon" id="rail-adb-2" title="Android Cockpit">
            <span class="icon">&#xe163;</span>
            <span class="beacon-dot"></span>
          </button>
          <button class="rail-item rail-add" id="rail-add-device" title="Add Host or Device">
            <span class="icon">&#xe13d;</span>
          </button>
          <div class="rail-spacer"></div>
          <button class="rail-item rail-download" id="rail-export" title="Export Configurations">
            <span class="icon">&#xe0b2;</span>
          </button>
        </aside>

        <!-- Main Workspace Dual Panels -->
        <div class="dual-panels-container">
          <!-- ═════════════════════════════════════════════════════════ -->
          <!-- LEFT PANEL: 5 Navigation Tabs + Group Filter + Group Cards -->
          <!-- ═════════════════════════════════════════════════════════ -->
          <section class="left-panel">
            <!-- Row 1: The 5 Navigation Tabs inside Left Panel (src/app.rs render_sidebar_tabs_bar) -->
            <div class="sidebar-tabs-bar">
              <button class="sidebar-tab active" data-tab="servers">
                <span class="icon">&#xe153;</span>
                <span>Servers</span>
              </button>
              <button class="sidebar-tab" data-tab="scripts">
                <span class="icon">&#xe2ed;</span>
                <span>Scripts</span>
              </button>
              <button class="sidebar-tab" data-tab="cmds">
                <span class="icon">&#xe181;</span>
                <span>Cmds</span>
              </button>
              <button class="sidebar-tab" data-tab="systemd">
                <span class="icon">&#xe245;</span>
                <span>SystemD</span>
              </button>
              <button class="sidebar-tab" data-tab="sensors">
                <span class="icon">&#xe186;</span>
                <span>Sensors</span>
              </button>
            </div>
