[package]
name = "server_launcher"
version = "0.1.0"
edition = "2021"
authors = ["Venuka Silva"]
description = "Cross-platform developer server launcher for Linux & Windows written in Rust"

[dependencies]
ironrdp = { git = "https://github.com/Devolutions/IronRDP.git", rev = "5eb8c371baf0cd5db9943c1109efa703c6aacce4", default-features = false, features = ["cliprdr", "connector", "core", "displaycontrol", "dvc", "graphics", "pdu", "rdpdr", "rdpsnd", "session", "svc"] }
ironrdp-blocking = { git = "https://github.com/Devolutions/IronRDP.git", rev = "5eb8c371baf0cd5db9943c1109efa703c6aacce4" }
ironrdp-bulk = { git = "https://github.com/Devolutions/IronRDP.git", rev = "5eb8c371baf0cd5db9943c1109efa703c6aacce4" }
ironrdp-egfx = { git = "https://github.com/Devolutions/IronRDP.git", rev = "5eb8c371baf0cd5db9943c1109efa703c6aacce4", features = ["openh264-libloading"] }
ironrdp-rdpsnd-native = { git = "https://github.com/Devolutions/IronRDP.git", rev = "5eb8c371baf0cd5db9943c1109efa703c6aacce4", default-features = false, features = ["capture"] }
ironrdp-rdpeai = { git = "https://github.com/Devolutions/IronRDP.git", rev = "5eb8c371baf0cd5db9943c1109efa703c6aacce4" }
ironrdp-rdpdr-native = { git = "https://github.com/Devolutions/IronRDP.git", rev = "5eb8c371baf0cd5db9943c1109efa703c6aacce4" }
ironrdp-mstsgu = { git = "https://github.com/Devolutions/IronRDP.git", rev = "5eb8c371baf0cd5db9943c1109efa703c6aacce4", features = ["rustls"] }
ironrdp-tls = { git = "https://github.com/Devolutions/IronRDP.git", rev = "5eb8c371baf0cd5db9943c1109efa703c6aacce4", features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
sha2 = "0.10"
tempfile = "3"
eframe = { version = "0.29", default-features = true, features = ["persistence"] }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
sysinfo = { version = "0.34", features = ["multithread"] }
chrono = "0.4"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
flate2 = "1.1"
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
tauri = "2"
zeroize = "1.9.0"
des = { version = "0.8.1", features = ["zeroize"] }
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(not(windows))'.dependencies]
getrandom = "0.4"
