[package]
name = "server_launcher"
version = "1.0.0"
edition = "2021"
authors = ["Venuka Silva"]
description = "Cross-platform developer server launcher for Linux & Windows written in Rust"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.31"
chrono = "0.4"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
