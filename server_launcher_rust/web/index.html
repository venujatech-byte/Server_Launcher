<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Server Launcher</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="app-window">
      <!-- 0. Dedicated Slim Custom Titlebar (Height 22px, matching egui) -->
      <div class="window-titlebar" id="window-titlebar" data-tauri-drag-region>
        <div class="titlebar-brand" data-tauri-drag-region>
          <span class="brand-dot">●</span>
          <span class="brand-title">SERVER LAUNCHER</span>
        </div>
        <div class="titlebar-controls" id="titlebar-controls">
          <button class="win-btn win-minimize" id="btn-minimize" title="Minimize" aria-label="Minimize">&#x2212;</button>
          <button class="win-btn win-maximize" id="btn-maximize" title="Maximize" aria-label="Maximize">&#x25a2;</button>
          <button class="win-btn win-close" id="btn-close" title="Close" aria-label="Close">&#x2715;</button>
        </div>
      </div>
