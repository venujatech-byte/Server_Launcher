name: Remote Desktop Compile Check

on:
  push:
    branches: [vnc/rdp]
    paths:
      - "server_launcher_rust/**"
      - ".github/workflows/remote-desktop-check.yml"
  pull_request:
    paths:
      - "server_launcher_rust/**"
      - ".github/workflows/remote-desktop-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-linux:
    name: Check Rust desktop app for Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server_launcher_rust

      - name: Check all targets
        working-directory: server_launcher_rust
        run: cargo check --locked --all-targets

  check-windows:
    name: Check Rust desktop app for Windows
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server_launcher_rust

      - name: Check all targets
        working-directory: server_launcher_rust
        run: cargo check --locked --all-targets --target x86_64-pc-windows-msvc
