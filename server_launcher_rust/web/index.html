<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Server Launcher</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="app-layout">
      <!-- Titlebar -->
      <header class="window-titlebar" id="window-titlebar">
        <div class="titlebar-brand">
          <span class="brand-dot"></span>
          <span class="brand-title">SERVER LAUNCHER</span>
        </div>
        <div class="titlebar-controls">
          <button class="win-btn win-minimize" id="btn-minimize" title="Minimize" aria-label="Minimize">&#x2212;</button>
          <button class="win-btn win-maximize" id="btn-maximize" title="Maximize" aria-label="Maximize">&#x25a2;</button>
          <button class="win-btn win-close" id="btn-close" title="Close" aria-label="Close">&#x2715;</button>
        </div>
      </header>
      
      <!-- Main Content Container -->
      <div class="app-main-container" id="app-main-container">
        <!-- Top Navigation & Header Row -->
        <header class="app-header">
          <div class="header-left">
            <button class="brand-launcher-circle" title="Server Launcher" aria-label="Play">
              <span class="icon">&#xe1c4;</span>
            </button>
            <div class="header-titles">
              <h1 class="header-app-name">Server Launcher</h1>
              <div class="header-meta">
                <span class="meta-label">this pc:</span> <span class="meta-ip">198.18.0.1</span>
                <span class="meta-divider">&bull;</span>
                <span class="meta-label">servers:</span> <span class="meta-count">5</span>
              </div>
            </div>
          </div>
          <div class="header-right">
            <div class="search-pill-box">
              <kbd class="kbd-hint">Ctrl+K</kbd>
              <input type="text" class="search-input" id="global-search" placeholder="Search instances, ports..." />
              <span class="icon search-icon">&#xe14c;</span>
            </div>
            <button class="btn-pill btn-quick-launch" id="btn-quick-launch">
              <span class="icon icon-lightning">&#xe213;</span>
              <span>Quick Launch Ctrl+P</span>
            </button>
            <button class="btn-pill btn-add-server" id="btn-add-server">
              <span class="icon">&#xe12a;</span>
              <span>+ Add Server</span>
            </button>
          </div>
        </header>
      </div>
    </div>
  </body>
</html>
