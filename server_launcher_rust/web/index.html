<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Android Cockpit · Server Launcher</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#overview"><span class="brand-mark icon">&#xe153;</span><span><b>Server Launcher</b><small>ANDROID COCKPIT</small></span></a>
        <div class="device-label">DEVICE</div>
        <select id="device-select" aria-label="Android device"><option>Searching for devices…</option></select>
        <div id="connection-state" class="connection"><i></i><span>Connecting to ADB</span></div>
        <nav id="navigation" aria-label="Device management">
          <button class="nav-item active" data-tab="overview"><span class="icon">&#xe101;</span>Overview</button>
          <button class="nav-item" data-tab="screen"><span class="icon">&#xe14f;</span>Screen</button>
          <button class="nav-item" data-tab="messages"><span class="icon">&#xe119;</span>Messages</button>
          <button class="nav-item" data-tab="calls"><span class="icon">&#xe133;</span>Calls</button>
          <button class="nav-item" data-tab="photos"><span class="icon">&#xe0f7;</span>Photos</button>
          <button class="nav-item" data-tab="notifications"><span class="icon">&#xe056;</span>Notifications</button>
          <button class="nav-item" data-tab="sensors"><span class="icon">&#xe186;</span>Sensors</button>
          <div class="nav-divider"></div>
          <button class="nav-item" data-tab="storage"><span class="icon">&#xe0c5;</span>Storage</button>
          <button class="nav-item" data-tab="apps"><span class="icon">&#xe129;</span>Apps</button>
          <button class="nav-item" data-tab="clipboard"><span class="icon">&#xe085;</span>Clipboard</button>
          <button class="nav-item" data-tab="terminal"><span class="icon">&#xe181;</span>Terminal</button>
          <button class="nav-item" data-tab="wireless"><span class="icon">&#xe1ae;</span>Wireless</button>
          <button class="nav-item" data-tab="firmware"><span class="icon">&#xe163;</span>Device controls</button>
        </nav>
        <div class="sidebar-footer"><span class="status-dot"></span> Local ADB bridge</div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div><div id="eyebrow" class="eyebrow">DEVICE OVERVIEW</div><h1 id="page-title">Overview</h1></div>
          <div class="top-actions">
            <div id="sensors-header-controls" class="sensors-header-controls" style="display: none;">
              <div class="live-pulse-badge">
                <div class="live-pulse-dot" id="header-pulse-dot"></div>
                <span id="header-pulse-text">LIVE 60S</span>
              </div>
              <div class="cadence-control-group">
                <label class="sensor-cadence-label" for="sensor-cadence">Cadence</label>
                <select class="input sensor-cadence-select" id="sensor-cadence">
                  <option value="1000">1s (Fast)</option>
                  <option value="2000" selected>2s (Standard)</option>
                  <option value="5000">5s (Low power)</option>
                  <option value="0">Paused</option>
                </select>
              </div>
            </div>
            <button class="button tonal refresh-topbar-btn" id="refresh" title="Refresh current view" aria-label="Refresh">
              <span class="icon">&#xe145;</span><span>Refresh</span>
            </button>
            <span id="device-model" class="device-chip">No device selected</span>
            <button class="button primary" data-action="scrcpy"><span class="icon">&#xe0b9;</span> Open scrcpy</button>
          </div>
        </header>
        <section id="content" class="content"><div class="loading-card"><span class="spinner"></span><p>Looking for Android devices…</p></div></section>
        <div id="toast" class="toast" role="status"></div>
      </main>
    </div>
  </body>
</html>
