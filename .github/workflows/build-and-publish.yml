name: Build and Publish Release

on:
  push:
    branches:
      - main
      - design
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxkbcommon-dev \
            pkg-config \
            wget

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server_launcher_rust

      - name: Build release binary
        working-directory: server_launcher_rust
        run: cargo build --release

      - name: Package Linux binary
        run: |
          tar -czf server_launcher-linux-x86_64.tar.gz -C server_launcher_rust/target/release server_launcher

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: server_launcher-linux-x86_64.tar.gz
          path: server_launcher-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Write release description
        env:
          EVENT_REF_TYPE: ${{ github.ref_type }}
          BUILD_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$EVENT_REF_TYPE" == "tag" ]]; then
            PREVIOUS_BUILD=$(git describe --tags --abbrev=0 --match 'v*' "${BUILD_SHA}^" 2>/dev/null || true)
          else
            PREVIOUS_BUILD=$(git describe --tags --abbrev=0 --match 'v*' "$BUILD_SHA" 2>/dev/null || true)
          fi

          CARGO_VERSION=$(grep -m1 '^version = ' server_launcher_rust/Cargo.toml | cut -d '"' -f 2)
          MAJOR_MINOR=$(echo "$CARGO_VERSION" | cut -d '.' -f 1,2)
          if [[ "$EVENT_REF_TYPE" == "tag" ]]; then
            TAG_NAME="$BRANCH_NAME"
          else
            TAG_NAME="v${MAJOR_MINOR}.${RUN_NUMBER}"
          fi

          {
            printf '%s\n' '### Automated Build'
            printf -- '- **Version**: `%s`\n' "$TAG_NAME"
            printf -- '- **Commit**: [%s](%s/%s/commit/%s)\n' "$BUILD_SHA" "$SERVER_URL" "$REPOSITORY" "$BUILD_SHA"
            printf -- '- **Branch**: `%s`\n' "$BRANCH_NAME"
            printf '%s\n' '- **Artifact**: Linux (`server_launcher-linux-x86_64.tar.gz`)'
            printf '\n%s\n' '### Commit messages since the previous build'
            if [[ -n "$PREVIOUS_BUILD" ]]; then
              git log --reverse --format='- %s (`%h`)' "$PREVIOUS_BUILD..$BUILD_SHA"
            else
              git log --reverse --format='- %s (`%h`)' "$BUILD_SHA"
            fi
          } > release-notes.md

      - name: Determine Release Tag & Metadata
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_TITLE="Release ${TAG_NAME}"
          else
            CARGO_VERSION=$(grep -m1 '^version = ' server_launcher_rust/Cargo.toml | cut -d '"' -f 2)
            MAJOR_MINOR=$(echo "$CARGO_VERSION" | cut -d '.' -f 1,2)
            TAG_NAME="v${MAJOR_MINOR}.${{ github.run_number }}"
            RELEASE_TITLE="Release ${TAG_NAME}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_title }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: release-assets/*
          body_path: release-notes.md

